name: KeepAlive

on:
  schedule:
    - cron: "0 3 * * *" # 每天北京时间 11:00 检查一次
  workflow_dispatch: # 支持手动触发，便于验证

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep alive with random interval (15-30 days)
        run: |
          set -e

          # 状态文件，记录下一次保活提交的到期时间戳
          STATE_FILE=".github/keepalive-next.txt"
          NOW=$(date +%s)

          # 生成下一次到期时间的随机函数（15~30天后）
          generate_next() {
            local days=$(( (RANDOM % 16) + 15 ))  # 15~30 天
            echo "下次保活将在 ${days} 天后"
            date -d "+${days} days" +%s > "$STATE_FILE"
            git add "$STATE_FILE"
            git commit -m "chore: schedule next keepalive [skip ci]" || true
            git push || true
          }

          # 首次运行：状态文件不存在，先定一个随机日期，本次不提交
          if [ ! -f "$STATE_FILE" ]; then
            echo "首次运行，未找到状态文件，设定下一次随机保活日期"
            generate_next
            exit 0
          fi

          # 读取状态文件（文件在 HEAD 中，检查时会被 checkout 出来）
          NEXT=$(cat "$STATE_FILE" 2>/dev/null || echo "0")

          echo "当前时间戳: $NOW"
          echo "计划保活时间戳: $NEXT"

          # 未到计划时间，继续等待
          if [ "$NOW" -lt "$NEXT" ]; then
            echo "尚未到计划保活时间，继续等待"
            exit 0
          fi

          # 已到计划时间，提交保活 commit 并安排下一次随机日期
          echo "已到计划保活时间，提交保活 commit"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          git push
          generate_next
