name: KeepAlive

on:
  schedule:
    - cron: "0 3 * * *" # 每天北京时间 11:00 检查一次

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check last commit and keep alive
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last_commit) / 86400 ))
          echo "最近提交距今 ${days} 天"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
            echo "已提交保活 commit，重置 60 天计时器"
          else
            echo "无需保活，继续等待"
          fi
